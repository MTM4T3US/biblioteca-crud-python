{% extends 'base.html' %}{% block title %}{{ titulo }} | Biblioteca{% endblock %}{% block content %}<h1>{{ titulo }}</h1><form class="panel form-grid" method="post"><label for="alu_nome">Nome *</label><input id="alu_nome" name="alu_nome" required value="{{ aluno.alu_nome if aluno else '' }}"><label for="alu_matricula">Matrícula *</label><input id="alu_matricula" name="alu_matricula" required value="{{ aluno.alu_matricula if aluno else '' }}"><label for="alu_turma">Turma *</label><input id="alu_turma" name="alu_turma" required value="{{ aluno.alu_turma if aluno else '' }}"><label for="alu_email">E-mail</label><input id="alu_email" type="email" name="alu_email" value="{{ aluno.alu_email if aluno else '' }}"><br><button class="btn">Salvar</button> <a class="btn secondary" href="{{ url_for('listar_alunos') }}">Cancelar</a></form>{% endblock %}
