{% extends 'base.html' %}{% block title %}{{ titulo }} | Biblioteca{% endblock %}{% block content %}<h1>{{ titulo }}</h1><form class="panel form-grid" method="post"><label for="emp_data">Data do empréstimo *</label><input id="emp_data" type="date" name="emp_data" required value="{{ emprestimo.emp_data if emprestimo else '' }}"><label for="alu_codigo">Aluno *</label><select id="alu_codigo" name="alu_codigo" required>{% for aluno in alunos %}<option value="{{ aluno.alu_codigo }}" {% if emprestimo and emprestimo.alu_codigo == aluno.alu_codigo %}selected{% endif %}>{{ aluno.alu_nome }} — {{ aluno.alu_matricula }}</option>{% endfor %}</select><label for="liv_codigo">Livro *</label><select id="liv_codigo" name="liv_codigo" required>{% for livro in livros %}<option value="{{ livro.liv_codigo }}" {% if emprestimo and emprestimo.liv_codigo == livro.liv_codigo %}selected{% endif %}>{{ livro.liv_titulo }}</option>{% endfor %}</select><label for="emp_devolucao">Data de devolução</label><input id="emp_devolucao" type="date" name="emp_devolucao" value="{{ emprestimo.emp_devolucao if emprestimo else '' }}"><label for="emp_status">Status *</label><select id="emp_status" name="emp_status"><option value="emprestado" {% if not emprestimo or emprestimo.emp_status == 'emprestado' %}selected{% endif %}>Emprestado</option><option value="devolvido" {% if emprestimo and emprestimo.emp_status == 'devolvido' %}selected{% endif %}>Devolvido</option><option value="atrasado" {% if emprestimo and emprestimo.emp_status == 'atrasado' %}selected{% endif %}>Atrasado</option></select><br><button class="btn">Salvar</button> <a class="btn secondary" href="{{ url_for('listar_emprestimos') }}">Cancelar</a></form>{% endblock %}
