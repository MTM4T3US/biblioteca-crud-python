{% extends 'base.html' %}{% block title %}{{ titulo }} | Biblioteca{% endblock %}{% block content %}<h1>{{ titulo }}</h1><form class="panel form-grid" method="post"><label for="liv_titulo">Título *</label><input id="liv_titulo" name="liv_titulo" required value="{{ livro.liv_titulo if livro else '' }}"><label for="liv_autor">Autor *</label><input id="liv_autor" name="liv_autor" required value="{{ livro.liv_autor if livro else '' }}"><label for="liv_ano">Ano</label><input id="liv_ano" type="number" name="liv_ano" value="{{ livro.liv_ano if livro else '' }}"><label for="liv_quantidade">Quantidade *</label><input id="liv_quantidade" type="number" min="0" name="liv_quantidade" required value="{{ livro.liv_quantidade if livro else 1 }}"><br><button class="btn">Salvar</button> <a class="btn secondary" href="{{ url_for('listar_livros') }}">Cancelar</a></form>{% endblock %}
